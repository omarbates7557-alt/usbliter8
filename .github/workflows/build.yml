name: Build usbliter8

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            build-essential \
            git

      - name: Clone Pico SDK
        run: |
          git clone https://github.com/raspberrypi/pico-sdk.git /home/runner/pico-sdk
          cd /home/runner/pico-sdk
          git submodule update --init --recursive

      - name: Build
        run: |
          export PICO_SDK_PATH=/home/runner/pico-sdk
          rm -rf build
          cmake -B build -G Ninja -DPICO_BOARD=pico
          cmake --build build

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: usbliter8-uf2
          path: build/*.uf2
