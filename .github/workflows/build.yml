name: Build usbliter8

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            build-essential \
            git

      - name: Clone Pico SDK
        run: |
          git clone https://github.com/raspberrypi/pico-sdk.git "$HOME/pico-sdk"
          cd "$HOME/pico-sdk"
          git submodule update --init --recursive

      - name: Build
        env:
          PICO_SDK_PATH: ${{ env.HOME }}/pico-sdk
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja -DPICO_BOARD=pico
          cmake --build .

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: usbliter8-uf2
          path: build/*.uf2
